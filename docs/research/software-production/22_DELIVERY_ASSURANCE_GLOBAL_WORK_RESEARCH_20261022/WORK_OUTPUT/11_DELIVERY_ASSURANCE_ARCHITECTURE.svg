<text x="60" y="1772" class="sub">箭头函数与固定源码：11_ARCHITECTURE_EXPLAINED.md；唯一技术合同：02–06；图源：本 SVG。</text><text x="60" y="1812" class="sub">自动路径只在对应宿主已实测、角色已获权且原 owner 存活时成立。没有增加后台服务或第四工作流。</text></svg>