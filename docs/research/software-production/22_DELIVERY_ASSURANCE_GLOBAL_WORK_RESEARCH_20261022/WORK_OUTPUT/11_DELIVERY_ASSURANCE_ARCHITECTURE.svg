<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">Delivery Assurance：角色、程序与线程</title><desc id="desc">当前Codex主线程负责实现与返修。Bridge Kit是接线与反馈程序，workflow-core是共享规则库，项目验收程序是工具，均不是代理。独立审查者在获授权的单次Codex子进程或既有子代理中运行；原外部规划、审查和核验角色使用各自原有任务及接收者。所有新增连接均待实施和验证。</desc>
<defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}</style>
<marker id="green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2L10 6L2 10" stroke="#087F73" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker>
<marker id="red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2L10 6L2 10" stroke="#BA513C" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker>
<marker id="amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2L10 6L2 10" stroke="#9A682C" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker>
</defs><rect width="1920" height="1080" fill="#FAFCFD"/>
<text x="64" y="91" font-size="52" fill="#193243" font-weight="700" text-anchor="start">Delivery Assurance：角色、程序与线程</text>
<text x="66" y="147" font-size="29" fill="#536974" font-weight="400" text-anchor="start">谁负责实现，谁调用规则，谁独立审查，结果回到哪个任务。</text>
<text x="64" y="220" font-size="28" fill="#193243" font-weight="600" text-anchor="start">用户照常提出需求</text>
<path d="M234 232V254" stroke="#087F73" fill="none" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#green)"/>
<rect x="64" y="263" width="340" height="438" rx="20" fill="#EAF3FA" stroke="#B9D2E5" stroke-width="2"/>
<text x="234" y="308" font-size="30" fill="#193243" font-weight="700" text-anchor="middle">当前 Codex 主线程</text>
<text x="234" y="351" font-size="25" fill="#536974" font-weight="400" text-anchor="middle">实现者｜你原来的任务</text>
<path d="M86 373H382" stroke="#C7DAE8" stroke-width="2"/>
<text x="234" y="414" font-size="25" fill="#193243" font-weight="400" text-anchor="middle">理解原要求，提出实现方案</text>
<text x="234" y="457" font-size="25" fill="#193243" font-weight="400" text-anchor="middle">用成熟能力开发产品</text>
<text x="234" y="500" font-size="25" fill="#193243" font-weight="400" text-anchor="middle">缺检查时补写候选程序</text>
<text x="234" y="589" font-size="27" fill="#BA513C" font-weight="600" text-anchor="middle">收到问题后继续修复</text>
<text x="234" y="632" font-size="25" fill="#536974" font-weight="400" text-anchor="middle">重新提交修好的当前版本</text>
<text x="234" y="675" font-size="24" fill="#536974" font-weight="400" text-anchor="middle">权限与预算仍受原任务约束</text>
<rect x="534" y="263" width="400" height="398" rx="20" fill="#FFFFFF" stroke="#B6CCD8" stroke-width="2"/>
<text x="734" y="309" font-size="37" fill="#193243" font-weight="700" text-anchor="middle">Bridge Kit</text>
<text x="734" y="352" font-size="24" fill="#536974" font-weight="400" text-anchor="middle">接线程序｜不是模型或子代理</text>
<text x="734" y="404" font-size="25" fill="#193243" font-weight="400" text-anchor="middle">保存原文、权限与任务身份</text>
<text x="734" y="447" font-size="25" fill="#193243" font-weight="400" text-anchor="middle">调用规则库、项目检查与角色</text>
<text x="734" y="490" font-size="25" fill="#193243" font-weight="400" text-anchor="middle">核验返回结果属于哪个任务</text>
<path d="M558 518H910" stroke="#D7E3E8" stroke-width="2"/>
<text x="734" y="562" font-size="27" fill="#087F73" font-weight="600" text-anchor="middle">正常结束时强制交付检查</text>
<text x="734" y="607" font-size="25" fill="#536974" font-weight="400" text-anchor="middle">证据成立才生成用户报告</text>
<path d="M404 407H527" stroke="#087F73" fill="none" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#green)"/>
<rect x="413.0" y="372" width="112" height="33" rx="5" fill="#FAFCFD" stroke="none" stroke-width="2"/>
<text x="469" y="393" font-size="23" fill="#087F73" font-weight="500" text-anchor="middle">任务输入</text>
<path d="M534 546H411" stroke="#BA513C" fill="none" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#red)"/>
<rect x="413.0" y="512" width="112" height="33" rx="5" fill="#FAFCFD" stroke="none" stroke-width="2"/>
<text x="469" y="533" font-size="23" fill="#BA513C" font-weight="500" text-anchor="middle">失败证据</text>
<rect x="64" y="784" width="340" height="132" rx="18" fill="#E2F3EC" stroke="#B9DDCD" stroke-width="2"/>
<text x="234" y="829" font-size="31" fill="#087F73" font-weight="700" text-anchor="middle">用户最终报告</text>
<text x="234" y="871" font-size="25" fill="#536974" font-weight="400" text-anchor="middle">完成项、证据、未证部分</text>
<path d="M534 620H463V850H411" stroke="#087F73" fill="none" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#green)"/>
<rect x="409.0" y="734" width="112" height="33" rx="5" fill="#FAFCFD" stroke="none" stroke-width="2"/>
<text x="465" y="755" font-size="23" fill="#087F73" font-weight="500" text-anchor="middle">获准交付</text>
<rect x="534" y="736" width="400" height="181" rx="18" fill="#F0F0F8" stroke="#D0D2E5" stroke-width="2"/>
<text x="734" y="778" font-size="33" fill="#193243" font-weight="700" text-anchor="middle">workflow-core</text>
<text x="734" y="815" font-size="24" fill="#536974" font-weight="400" text-anchor="middle">共享规则库｜不是线程或代理</text>
<text x="734" y="854" font-size="25" fill="#193243" font-weight="400" text-anchor="middle">旧功能、检查、专业能力选择</text>
<text x="734" y="893" font-size="25" fill="#193243" font-weight="400" text-anchor="middle">验收器资格与交付规则判断</text>
<path d="M621 661V729" stroke="#087F73" fill="none" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#green)"/>
<path d="M849 736V668" stroke="#087F73" fill="none" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#green)"/>
<text x="601" y="703" font-size="23" fill="#087F73" font-weight="400" text-anchor="end">调用规则</text>
<text x="829" y="710" font-size="23" fill="#087F73" font-weight="400" text-anchor="end">返回判断</text>
<rect x="1004" y="219" width="852" height="467" rx="20" fill="#FFF8ED" stroke="#DEC79D" stroke-width="2" stroke-dasharray="9 6"/>
<text x="1031" y="263" font-size="29" fill="#193243" font-weight="700" text-anchor="start">独立角色与其他线程：按需选择已有合法通道</text>
<rect x="1032" y="303" width="370" height="354" rx="16" fill="#FFFFFF" stroke="#E5D5B9" stroke-width="2"/>
<text x="1217" y="345" font-size="31" fill="#193243" font-weight="700" text-anchor="middle">本机项目审查者</text>
<text x="1217" y="383" font-size="23" fill="#536974" font-weight="400" text-anchor="middle">单次子进程，独立 Codex 线程</text>
<text x="1217" y="430" font-size="24" fill="#193243" font-weight="400" text-anchor="middle">事前核对：只读原始材料</text>
<text x="1217" y="468" font-size="24" fill="#193243" font-weight="400" text-anchor="middle">验收器准入：独立审查</text>
<text x="1217" y="506" font-size="24" fill="#193243" font-weight="400" text-anchor="middle">产品验收：按原项目权限</text>
<path d="M1052 532H1382" stroke="#E8DFCF" stroke-width="2"/>
<text x="1217" y="569" font-size="23" fill="#536974" font-weight="400" text-anchor="middle">已有原生子代理可作替代</text>
<text x="1217" y="607" font-size="23" fill="#536974" font-weight="400" text-anchor="middle">仅限项目原本采用且已获准</text>
<text x="1217" y="642" font-size="23" fill="#536974" font-weight="400" text-anchor="middle">不能修改候选产品与标准</text>
<rect x="1434" y="303" width="394" height="354" rx="16" fill="#FFFFFF" stroke="#E5D5B9" stroke-width="2"/>
<text x="1631" y="345" font-size="31" fill="#193243" font-weight="700" text-anchor="middle">原有外部任务／会话</text>
<text x="1631" y="383" font-size="23" fill="#536974" font-weight="400" text-anchor="middle">原安排任务或项目控制者启动</text>
<text x="1631" y="430" font-size="24" fill="#193243" font-weight="400" text-anchor="middle">规划者：专业目标与方法</text>
<text x="1631" y="468" font-size="24" fill="#193243" font-weight="400" text-anchor="middle">审查者：独立复核产物</text>
<text x="1631" y="506" font-size="24" fill="#193243" font-weight="400" text-anchor="middle">核验者：仅原项目已有时</text>
<path d="M1454 532H1808" stroke="#E8DFCF" stroke-width="2"/>
<text x="1631" y="569" font-size="23" fill="#536974" font-weight="400" text-anchor="middle">原接收者取回并消费结果</text>
<text x="1631" y="607" font-size="23" fill="#536974" font-weight="400" text-anchor="middle">接管时可能是另一执行会话</text>
<text x="1631" y="642" font-size="23" fill="#536974" font-weight="400" text-anchor="middle">不能说成恢复了原聊天线程</text>
<path d="M934 407H998" stroke="#087F73" fill="none" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#green)"/>
<rect x="935.0" y="371" width="66" height="33" rx="5" fill="#FAFCFD" stroke="none" stroke-width="2"/>
<text x="968" y="392" font-size="23" fill="#087F73" font-weight="500" text-anchor="middle">原文</text>
<path d="M1004 513H940" stroke="#087F73" fill="none" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#green)"/>
<rect x="936.0" y="477" width="66" height="33" rx="5" fill="#FAFCFD" stroke="none" stroke-width="2"/>
<text x="969" y="498" font-size="23" fill="#087F73" font-weight="500" text-anchor="middle">结果</text>
<rect x="1064" y="736" width="418" height="181" rx="18" fill="#EDF6F2" stroke="#C5DDCF" stroke-width="2"/>
<text x="1273" y="778" font-size="32" fill="#193243" font-weight="700" text-anchor="middle">项目验收程序</text>
<text x="1273" y="815" font-size="24" fill="#536974" font-weight="400" text-anchor="middle">工具与脚本｜不是审查代理</text>
<text x="1273" y="854" font-size="25" fill="#193243" font-weight="400" text-anchor="middle">观察实际成品与原始数据</text>
<text x="1273" y="893" font-size="25" fill="#193243" font-weight="400" text-anchor="middle">按项目标准输出专业证据</text>
<path d="M934 608H1020V830H1058" stroke="#087F73" fill="none" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#green)"/>
<text x="1040" y="718" font-size="23" fill="#087F73" font-weight="400" text-anchor="start">调用验收</text>
<path d="M1064 882H970V649H940" stroke="#087F73" fill="none" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#green)"/>
<rect x="984.0" y="886" width="66" height="33" rx="5" fill="#FAFCFD" stroke="none" stroke-width="2"/>
<text x="1017" y="907" font-size="23" fill="#087F73" font-weight="500" text-anchor="middle">证据</text>
<text x="1690" y="772" font-size="26" fill="#193243" font-weight="600" text-anchor="middle">没有固定的一组新增子代理</text>
<text x="1690" y="819" font-size="25" fill="#536974" font-weight="400" text-anchor="middle">简单任务可在主线程自查</text>
<text x="1690" y="861" font-size="25" fill="#536974" font-weight="400" text-anchor="middle">独立角色不代替主任务返修</text>
<text x="1690" y="903" font-size="25" fill="#536974" font-weight="400" text-anchor="middle">不同阶段权限不能混用</text>
<rect x="64" y="970" width="1792" height="63" rx="14" fill="#FBF1E3" stroke="none" stroke-width="2"/>
<text x="960" y="1010" font-size="26" fill="#80582C" font-weight="400" text-anchor="middle">缺授权、缺合法角色通道、环境不支持或原任务已退出：明确未完成，保留恢复位置，不假装自动唤醒。</text>
<text x="960" y="1066" font-size="24" fill="#536974" font-weight="400" text-anchor="middle">设计已通过；图中新增接线、角色调用与交付检查尚未实施和验证</text>
</svg>
