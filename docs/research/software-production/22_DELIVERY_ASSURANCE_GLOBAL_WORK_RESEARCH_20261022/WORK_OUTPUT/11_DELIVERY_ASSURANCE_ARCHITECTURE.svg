<title id="title">Delivery Assurance：正常请求到可信交付</title><desc id="desc">R3 冻结设计。蓝色为待实现连接，绿色为已有代码或角色合同，橙色为宿主和授权条件。箭头 A1 到 A9 见 11_ARCHITECTURE_EXPLAINED.md。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#53708a"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b44a38"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#173047}.title{font-size:38px;font-weight:700}.sub{font-size:24px;fill:#506276}.head{font-size:29px;font-weight:700}.body{font-size:24px}.code{font-family:Consolas,"Microsoft YaHei",monospace;font-size:21px;fill:#315674}.tag{font-size:21px;font-weight:700}.arrow{fill:none;stroke:#53708a;stroke-width:3;marker-end:url(#arrow)}.loop{fill:none;stroke:#b44a38;stroke-width:3;marker-end:url(#red)}.label{font-size:22px;font-weight:700;fill:#315674}</style>
<rect width="1600" height="1840" fill="#f7f9fc"/>
<text x="60" y="64" class="title">Delivery Assurance：普通请求怎样走到可信交付</text>
<text x="60" y="108" class="sub">贯穿案例：Lucerna“检查中不算故障；真实故障仍要提示”</text>
<rect x="60" y="132" width="22" height="22" rx="4" fill="#e6efff" stroke="#739bd4"/><text x="94" y="151" class="tag">待实现接线</text>
<rect x="300" y="132" width="22" height="22" rx="4" fill="#e7f4ee" stroke="#64a08b"/><text x="334" y="151" class="tag">已有代码／角色合同</text>
<rect x="650" y="132" width="22" height="22" rx="4" fill="#fff4dd" stroke="#bc8a2f" stroke-dasharray="5 3"/><text x="684" y="151" class="tag">须验证宿主／已有授权</text>
<text x="1090" y="151" class="tag" fill="#a35430">设计通过 ≠ 已经可用</text>
<rect x="60" y="195" width="910" height="130" rx="16" fill="#fff4dd" stroke="#bc8a2f" stroke-width="2" stroke-dasharray="8 5"/><text x="84" y="234" class="head">普通 Codex 请求：不要求先写 Goal</text>
<text x="84" y="273" class="body">当前原文、材料、仓库与权限；保留同一任务身份</text>
<text x="84" y="307" class="code">UserPromptSubmit / 已有 Lite、Review、Control 入口</text>
<rect x="60" y="380" width="910" height="175" rx="16" fill="#e6efff" stroke="#739bd4" stroke-width="2"/><text x="84" y="419" class="head">先核对要求；第一次相关产品写入前决定</text>
<text x="84" y="458" class="body">机械明确的小修 → 当前 Executor 自查</text>
<text x="84" y="492" class="body">新含义／来源／重要风险 → 右侧原独立角色</text>
<text x="84" y="526" class="code">prepare_admission → decide_admission_route</text>
<rect x="1050" y="380" width="490" height="270" rx="16" fill="#e7f4ee" stroke="#64a08b" stroke-width="2"/><text x="1074" y="419" class="head">原独立角色＋待实现调用</text>
<text x="1074" y="458" class="body">读完整原文，不只读摘要</text>
<text x="1074" y="492" class="body">本机只读 Reviewer；或已有</text>
<text x="1074" y="526" class="body">Review / Control 的实际通道</text>
<text x="1074" y="560" class="body">当前 owner 收到结果才放行</text>
<text x="1074" y="594" class="code">run_admission_review</text>
<text x="1074" y="624" class="code">consume_requirement_review</text>
<rect x="60" y="615" width="910" height="155" rx="16" fill="#e6efff" stroke="#739bd4" stroke-width="2"/><text x="84" y="654" class="head">选择成熟能力，也选出旧功能保护</text>
<text x="84" y="693" class="body">当前 Executor 实际读取／调用；固定版本与实现影响</text>
<text x="84" y="727" class="body">本例：状态语义、已有回归、原生审查；保留真实故障警示</text>
<text x="84" y="761" class="code">select_execution_capabilities / compile_obligations</text>
<rect x="60" y="830" width="910" height="150" rx="16" fill="#e6efff" stroke="#739bd4" stroke-width="2"/><text x="84" y="869" class="head">同一 Executor 实现；发现缺检查就补候选</text>
<text x="84" y="908" class="body">标准由原合同决定；不能改答案让测试变绿</text>
<text x="84" y="942" class="body">已激活定义可复用，缺失定义走右侧准入</text>
<text x="84" y="976" class="code">select_checks / submit_definition</text>
<rect x="1050" y="735" width="490" height="270" rx="16" fill="#e6efff" stroke="#739bd4" stroke-width="2"/><text x="1074" y="774" class="head">验收器与 adapter 准入</text>
<text x="1074" y="813" class="body">候选 → 校准 → 精确版本激活</text>
<text x="1074" y="847" class="body">冻结：正确／错误／缺证／旧功能</text>
<text x="1074" y="881" class="body">机械规则按原政策自动准入</text>
<text x="1074" y="915" class="body">新专业判断由原独立角色批准</text>
<text x="1074" y="949" class="code">calibrate_definition</text>
<text x="1074" y="979" class="code">activate_definition</text>
<rect x="60" y="1040" width="910" height="185" rx="16" fill="#e7f4ee" stroke="#64a08b" stroke-width="2"/><text x="84" y="1079" class="head">七仓原专业验收：看真实成品与独立观察</text>
<text x="84" y="1118" class="body">Lucerna · Bobbio · Mica · SeminarArc · Asteria · CUHK_Date · CARE</text>
<text x="84" y="1152" class="body">本例：同 source / EXE / PID；独立检查状态、刷新与旧功能</text>
<text x="84" y="1186" class="body">现有 runner 产事实，拟新增 adapter 与 ingest_result 接收</text>
<text x="84" y="1220" class="code">材料就绪 REVIEW_BUNDLE_READY ≠ 最终 USER_READY</text>
<rect x="1050" y="1080" width="490" height="245" rx="16" fill="#e6efff" stroke="#739bd4" stroke-width="2"/><text x="1074" y="1119" class="head">失败回到原任务</text>
<text x="1074" y="1158" class="body">产品错 → 修产品；观察错 → 重采</text>
<text x="1074" y="1192" class="body">工具返回／已证 Stop／精确 resume</text>
<text x="1074" y="1226" class="body">当前 Executor 或原父进程消费</text>
<text x="1074" y="1260" class="body">共享预算；取消后不再启动</text>
<text x="1074" y="1294" class="code">Feedback → run_delivery_cycle</text>
<rect x="60" y="1290" width="910" height="235" rx="16" fill="#e6efff" stroke="#739bd4" stroke-width="2"/><text x="84" y="1329" class="head">正常结束时强制检查：漏写命令也必须发生</text>
<text x="84" y="1368" class="body">Stop／Lite 退出／Review 收回结果／Control 终态前</text>
<text x="84" y="1402" class="body">直接写 result“完成”也不能绕过；缺当前专业结果就拒绝</text>
<text x="84" y="1436" class="body">拟新增 finish_delivery → check_delivery</text>
<text x="84" y="1470" class="code">→ report → accept_submission</text>
<text x="84" y="1500" class="code">宿主接点、线程恢复与取消行为：先做 P0 实测</text>
<rect x="60" y="1560" width="910" height="160" rx="16" fill="#e6efff" stroke="#739bd4" stroke-width="2"/><text x="84" y="1599" class="head">用户最终拿到：可信报告，而不是一句自评</text>
<text x="84" y="1638" class="body">说清完成范围、实际被测对象、旧功能与未证边界</text>
<text x="84" y="1672" class="body">只有当前候选与报告绑定被接受，才可声称 USER_READY</text>
<text x="84" y="1706" class="code">原任务 delivery_assurance/report.md + manifest</text>
<rect x="1050" y="1400" width="490" height="320" rx="16" fill="#fff4dd" stroke="#bc8a2f" stroke-width="2" stroke-dasharray="8 5"/><text x="1074" y="1439" class="head">不能隐含成“全自动”的路径</text>
<text x="1074" y="1478" class="body">角色未获权／无合法返回通道</text>
<text x="1074" y="1512" class="body">→ 等原角色；保留同任务恢复点</text>
<text x="1074" y="1546" class="body">账号／设备／GPU／部署</text>
<text x="1074" y="1580" class="body">→ 仍需原任务精确授权</text>
<text x="1074" y="1614" class="body">Hook 缺席或 owner 已退出</text>
<text x="1074" y="1648" class="body">→ 不承诺撤回聊天／后台唤醒</text>
<text x="1074" y="1682" class="body">当前七仓 DA 均未启用</text>
