<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Lucerna：检查中不应误报故障，真正故障必须提示</title><desc id="desc">六条泳道按时间顺序展示用户、Codex、Bridge Kit、workflow-core、Lucerna专业验收和独立审查者。坏例是真故障被显示成正常，失败经Bridge Kit返回同一Codex后修复再验。这是预期执行路径，尚未实施验证。</desc><defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<marker id="main" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M2 2L10 6L2 10" fill="none" stroke="#137F78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="fail" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M2 2L10 6L2 10" fill="none" stroke="#BD5339" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="optional" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M2 2L10 6L2 10" fill="none" stroke="#456E92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><rect width="1920" height="1080" fill="#FCFDFE"/>
<text x="56" y="90" font-size="46" fill="#183342" font-weight="700" text-anchor="start">Lucerna：检查中不应误报故障，真正故障必须提示</text>
<rect x="41" y="151" width="278" height="62" rx="12" fill="#F3F5F7" stroke="#CBD8E0" stroke-width="2"/>
<text x="180" y="192" font-size="29" fill="#183342" font-weight="700" text-anchor="middle">用户</text>
<path d="M180 215V1054" stroke="#C8D4DC" stroke-width="2" stroke-dasharray="5 9"/>
<rect x="353" y="151" width="278" height="62" rx="12" fill="#EAF2FA" stroke="#CBD8E0" stroke-width="2"/>
<text x="492" y="192" font-size="29" fill="#183342" font-weight="700" text-anchor="middle">Codex</text>
<path d="M492 215V1054" stroke="#C8D4DC" stroke-width="2" stroke-dasharray="5 9"/>
<rect x="665" y="151" width="278" height="62" rx="12" fill="#F0EFF8" stroke="#CBD8E0" stroke-width="2"/>
<text x="804" y="192" font-size="29" fill="#183342" font-weight="700" text-anchor="middle">Bridge Kit</text>
<path d="M804 215V1054" stroke="#C8D4DC" stroke-width="2" stroke-dasharray="5 9"/>
<rect x="977" y="151" width="278" height="62" rx="12" fill="#EDF2F7" stroke="#CBD8E0" stroke-width="2"/>
<text x="1116" y="192" font-size="29" fill="#183342" font-weight="700" text-anchor="middle">workflow-core</text>
<path d="M1116 215V1054" stroke="#C8D4DC" stroke-width="2" stroke-dasharray="5 9"/>
<rect x="1289" y="151" width="278" height="62" rx="12" fill="#E9F5EF" stroke="#CBD8E0" stroke-width="2"/>
<text x="1428" y="192" font-size="29" fill="#183342" font-weight="700" text-anchor="middle">Lucerna 专业验收</text>
<path d="M1428 215V1054" stroke="#C8D4DC" stroke-width="2" stroke-dasharray="5 9"/>
<rect x="1601" y="151" width="278" height="62" rx="12" fill="#F5F3ED" stroke="#CBD8E0" stroke-width="2"/>
<text x="1740" y="192" font-size="29" fill="#183342" font-weight="700" text-anchor="middle">独立审查者</text>
<path d="M1740 215V1054" stroke="#C8D4DC" stroke-width="2" stroke-dasharray="5 9"/>
<path d="M180 251H486" fill="none" stroke="#137F78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#main)"/>
<text x="333.0" y="237" font-size="25" fill="#137F78" font-weight="400" text-anchor="middle">提出修复要求</text>
<path d="M492 311H798" fill="none" stroke="#137F78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#main)"/>
<text x="645.0" y="297" font-size="24" fill="#137F78" font-weight="400" text-anchor="middle">接入并保留原要求</text>
<path d="M804 371H1110" fill="none" stroke="#137F78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#main)"/>
<text x="957.0" y="357" font-size="24" fill="#137F78" font-weight="400" text-anchor="middle">原要求与已有功能</text>
<rect x="969" y="383" width="294" height="38" rx="9" fill="#EDF2F7" stroke="#CBD8E0" stroke-width="2"/>
<text x="1116" y="410" font-size="24" fill="#183342" font-weight="700" text-anchor="middle">确定检查与旧功能保护</text>
<path d="M1116 461H810" fill="none" stroke="#137F78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#main)"/>
<text x="963.0" y="447" font-size="24" fill="#137F78" font-weight="400" text-anchor="middle">范围与检查要求</text>
<path d="M804 511H1734" fill="none" stroke="#456E92" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#optional)" stroke-dasharray="9 7"/>
<text x="1269.0" y="497" font-size="25" fill="#456E92" font-weight="400" text-anchor="middle">必要时核对专业要求</text>
<path d="M1740 561H810" fill="none" stroke="#456E92" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#optional)" stroke-dasharray="9 7"/>
<text x="1275.0" y="547" font-size="25" fill="#456E92" font-weight="400" text-anchor="middle">独立意见</text>
<path d="M804 611H498" fill="none" stroke="#137F78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#main)"/>
<text x="651.0" y="597" font-size="24" fill="#137F78" font-weight="400" text-anchor="middle">按核定要求实现</text>
<rect x="390" y="630" width="204" height="41" rx="9" fill="#EAF2FA" stroke="#CBD8E0" stroke-width="2"/>
<text x="492" y="659" font-size="25" fill="#183342" font-weight="700" text-anchor="middle">修改 Lucerna</text>
<path d="M492 691H1422" fill="none" stroke="#137F78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#main)"/>
<text x="957.0" y="677" font-size="25" fill="#137F78" font-weight="400" text-anchor="middle">提交当前程序并验收</text>
<rect x="1289" y="700" width="278" height="45" rx="9" fill="#E9F5EF" stroke="#CBD8E0" stroke-width="2"/>
<text x="1428" y="732" font-size="25" fill="#183342" font-weight="700" text-anchor="middle">检查应用与状态数据</text>
<rect x="350" y="753" width="1150" height="150" rx="12" fill="#FFF8F3" stroke="#E7BAA6" stroke-width="2" stroke-dasharray="9 7"/>
<text x="371" y="783" font-size="24" fill="#BD5339" font-weight="700" text-anchor="start">若验收失败</text>
<path d="M1428 787H810" fill="none" stroke="#BD5339" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fail)"/>
<text x="1119.0" y="773" font-size="25" fill="#BD5339" font-weight="400" text-anchor="middle">真正故障被显示成正常</text>
<path d="M804 841H498" fill="none" stroke="#BD5339" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fail)"/>
<text x="651.0" y="827" font-size="24" fill="#BD5339" font-weight="400" text-anchor="middle">失败证据返回原任务</text>
<rect x="405" y="852" width="174" height="35" rx="8" fill="#FFF0E8" stroke="#E5B39F" stroke-width="2"/>
<text x="492" y="878" font-size="24" fill="#BD5339" font-weight="700" text-anchor="middle">修复原任务</text>
<path d="M492 894H1422" fill="none" stroke="#137F78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#main)"/>
<text x="957.0" y="880" font-size="24" fill="#137F78" font-weight="400" text-anchor="middle">修复后重新验收</text>
<path d="M1428 745H1592V907H1435" fill="none" stroke="#137F78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#main)"/>
<text x="1608" y="830" font-size="24" fill="#137F78" font-weight="400" text-anchor="start">检查通过</text>
<path d="M1428 937H810" fill="none" stroke="#137F78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#main)"/>
<text x="1119.0" y="923" font-size="24" fill="#137F78" font-weight="400" text-anchor="middle">当前版本的专业证据</text>
<path d="M1428 947H1734" fill="none" stroke="#456E92" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#optional)" stroke-dasharray="9 7"/>
<text x="1581.0" y="933" font-size="24" fill="#456E92" font-weight="400" text-anchor="middle">按需独立审查</text>
<path d="M1740 987H810" fill="none" stroke="#456E92" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#optional)" stroke-dasharray="9 7"/>
<text x="1275.0" y="973" font-size="24" fill="#456E92" font-weight="400" text-anchor="middle">独立结果</text>
<rect x="689" y="994" width="230" height="39" rx="9" fill="#F0EFF8" stroke="#CBD8E0" stroke-width="2"/>
<text x="804" y="1022" font-size="25" fill="#183342" font-weight="700" text-anchor="middle">最终交付检查</text>
<path d="M804 1048H186" fill="none" stroke="#137F78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#main)"/>
<text x="495.0" y="1034" font-size="24" fill="#137F78" font-weight="400" text-anchor="middle">交付核验结果</text>
</svg>
